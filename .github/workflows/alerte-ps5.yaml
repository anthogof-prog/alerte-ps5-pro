name: Alerte PS5 Pro
 
on:
  # Plus de "schedule" : GitHub retarde ou saute trop souvent ces lancements.
  # Le robot est déclenché toutes les 10 minutes par cron-job.org.
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test"
        type: boolean
        default: false
 
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Vérifier les stocks
        run: python check_stock.py ${{ inputs.test && '--test' || '' }}
        env:
          NTFY_TOPIC: "ps5pro-antho-r00a589j"
          ALERT_EMAIL: "anthogof@hotmail.fr"
