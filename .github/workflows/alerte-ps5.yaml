name: Alerte PS5 Pro

on:
  schedule:
    # Toutes les 10 min de 6h00 à 22h30 heure de Paris (heure d'hiver = UTC+1)
    - cron: "*/10 5-20 * * *"
    - cron: "0,10,20,30 21 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test"
        type: boolean
        default: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Vérifier les stocks
        run: python check_stock.py ${{ inputs.test && '--test' || '' }}
        env:
          NTFY_TOPIC: "ps5pro-antho-r00a589j"
          ALERT_EMAIL: "anthogof@hotmail.fr"
